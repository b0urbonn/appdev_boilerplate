plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.appmonitor'
version = '1.0.0'

android {
  namespace 'expo.modules.appmonitor'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // HeadlessJsTaskService (MaalamScanTaskService) lives in React Android.
  implementation 'com.facebook.react:react-android'
  implementation 'org.opencv:opencv:4.12.0'
}
